# Global Parameters
NFS_Core_Param {
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Protocols = 3, 4;
}

EXPORT_DEFAULTS {
    Attr_Expiration_Time = 0;
}

# Dynamic Exports Loop
{% for export in ganesha.exports %}
EXPORT {
    Export_Id = {{ export.id }};
    Path = "{{ export.path }}";
    Pseudo = "{{ export.pseudo }}";
    Access_Type = RW;
    Squash = No_Root_Squash;
    
    FSAL {
        Name = VFS;
    }

    SecType = "{{ export.sec_type }}";
}
{% endfor %}

