apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gluster
  annotations:
    defaultVolumeType: hostPath
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local
  annotations:
    defaultVolumeType: local
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

