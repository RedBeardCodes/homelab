apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gluster
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  defaultVolumeType: hostPath
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  defaultVolumeType: local

